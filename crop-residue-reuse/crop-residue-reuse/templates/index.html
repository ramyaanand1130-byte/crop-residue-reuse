<!doctype html>
<html lang="ta">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crop Residue Reuse Guide</title>
  <meta name="description" content="Tamil and English voice assistant that recommends how to reuse crop residue instead of burning it.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;700&family=Mukta+Malar:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip_link">Skip to content</a>

  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1 data-i18n="app_title">Crop Residue Reuse Guide</h1>
        <p data-i18n="app_tag"></p>
      </div>
      <div class="lang" role="group" aria-label="Language / மொழி">
        <button type="button" data-lang="ta" lang="ta">தமிழ்</button>
        <button type="button" data-lang="en" lang="en">English</button>
      </div>
    </div>
  </header>

  <nav class="tabs" aria-label="Sections">
    <button type="button" id="tabBtnNew" class="tab" aria-selected="true" aria-controls="tabNew" data-i18n="tab_new"></button>
    <button type="button" id="tabBtnHistory" class="tab" aria-selected="false" aria-controls="tabHistory" data-i18n="tab_history"></button>
  </nav>

  <main id="main" class="wrap">
    <noscript><p class="notice notice-warn">This page needs JavaScript. / இந்தப் பக்கத்திற்கு JavaScript தேவை.</p></noscript>

    <!-- ===================== NEW RECOMMENDATION ===================== -->
    <div id="tabNew">

      <section class="voice" id="voicePanel" aria-labelledby="voiceTitle">
        <h2 id="voiceTitle" class="voice-title" data-i18n="voice_title"></h2>

        <div class="mic-stage" id="micStage">
          <button type="button" id="micBtn" class="mic-btn" aria-describedby="voiceStatus">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"></rect>
              <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5M8.5 21.5h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
        </div>
        <p class="mic-label" id="micLabel"></p>
        <p class="voice-status" id="voiceStatus" role="status" aria-live="polite"></p>

        <p class="voice-question" id="voiceQuestion" aria-live="polite"></p>
        <p class="voice-heard" id="voiceHeard"></p>
        <p class="notice" id="voiceNotice" role="status" hidden></p>

        <ul class="tags" id="voiceSummary" aria-label="Answers so far"></ul>
      </section>

      <form id="residueForm" class="form" novalidate>

        <fieldset class="field">
          <legend><span class="step-no">1</span><span data-i18n="f_crop"></span></legend>
          <div class="choices" id="cropChoices" role="radiogroup"></div>
        </fieldset>

        <fieldset class="field">
          <legend><span class="step-no">2</span><span data-i18n="f_residue"></span></legend>
          <div class="choices" id="residueChoices" role="radiogroup"></div>
        </fieldset>

        <fieldset class="field">
          <legend><span class="step-no">3</span><span data-i18n="f_quantity"></span></legend>
          <div class="qty-row">
            <input type="number" id="quantity" inputmode="decimal" min="0" step="any" autocomplete="off" aria-label="Quantity">
            <select id="unit" aria-label="Unit"></select>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend><span class="step-no">4</span><span data-i18n="f_moisture"></span></legend>
          <div class="choices choices-wide" id="moistureChoices" role="radiogroup"></div>
        </fieldset>

        <fieldset class="field">
          <legend><span class="step-no">5</span><span data-i18n="f_quality"></span></legend>
          <div class="choices choices-wide" id="qualityChoices" role="radiogroup"></div>
        </fieldset>

        <fieldset class="field">
          <legend><span class="step-no">6</span><span data-i18n="f_location"></span></legend>
          <input type="text" id="location" maxlength="100" list="districtList" autocomplete="off" aria-label="Location">
          <datalist id="districtList"></datalist>
        </fieldset>

        <p class="form-error" id="formError" role="alert" hidden></p>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="btn_submit"></button>
          <button type="button" class="btn btn-quiet" id="clearBtn" data-i18n="btn_clear"></button>
        </div>
      </form>

      <section id="resultArea" class="results" aria-live="polite" hidden></section>
    </div>

    <!-- ===================== HISTORY ===================== -->
    <div id="tabHistory" hidden>
      <div class="hist-head">
        <h2 data-i18n="hist_title"></h2>
        <button type="button" class="btn btn-quiet btn-small" id="historyClear" data-i18n="hist_clear" hidden></button>
      </div>
      <p class="empty" id="historyEmpty" data-i18n="hist_empty" hidden></p>
      <p class="form-error" id="historyError" role="alert" hidden></p>
      <ul class="hist-list" id="historyList"></ul>
      <section id="historyDetail" class="results" hidden></section>
    </div>
  </main>

  <footer class="foot">
    <p data-i18n="foot_note"></p>
  </footer>

  <script src="{{ url_for('static', filename='parser.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
